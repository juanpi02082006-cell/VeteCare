spring.application.name=Vetecare
server.port=${PORT:8080}

# Fechas y números en español de Colombia, sin depender del navegador
spring.web.locale=es_CO
spring.web.locale-resolver=fixed

# Base de datos
# Sin variables de entorno: H2 guardado en el archivo ./data/vetcaredb (desarrollo local).
# Con DB_URL, DB_USERNAME y DB_PASSWORD: MySQL, por ejemplo
#   DB_URL=jdbc:mysql://HOST:3306/VetCareDB?useSSL=true&serverTimezone=America/Bogota
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/vetcaredb;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# update crea y ajusta las tablas; usar DDL_AUTO=validate cuando el esquema de MySQL esté estable
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

# Consola de H2 (solo administrador): http://localhost:8080/h2-console
spring.h2.console.enabled=${H2_CONSOLE:true}
