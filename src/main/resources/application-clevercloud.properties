# Perfil para Clever Cloud (se activa con SPRING_PROFILES_ACTIVE=clevercloud).
# Clever Cloud entrega los datos de la base MySQL vinculada en las variables MYSQL_ADDON_*,
# así que aquí no hay credenciales escritas.
spring.datasource.url=jdbc:mysql://${MYSQL_ADDON_HOST}:${MYSQL_ADDON_PORT}/${MYSQL_ADDON_DB}?useSSL=true&serverTimezone=America/Bogota&characterEncoding=UTF-8
spring.datasource.username=${MYSQL_ADDON_USER}
spring.datasource.password=${MYSQL_ADDON_PASSWORD}

# El plan DEV de MySQL admite pocas conexiones simultáneas
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

spring.h2.console.enabled=false
