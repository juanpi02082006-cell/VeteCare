<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Ingresar')}"></head>
<body class="vc-login">
<main class="vc-login-card">
    <div class="vc-login-logo"><svg th:replace="~{fragments :: huella}"></svg></div>
    <h1>VetCare Santander</h1>

    <div th:if="${param.error}" class="alert alert-danger py-2 small">Correo o contraseña incorrectos, o la cuenta está inactiva.</div>
    <div th:if="${param.salir}" class="alert alert-success py-2 small">Sesión cerrada.</div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label" for="correo">Correo</label>
            <input class="form-control" type="email" id="correo" name="correo" required autofocus autocomplete="username">
        </div>
        <div class="mb-4">
            <label class="form-label" for="password">Contraseña</label>
            <input class="form-control" type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <button class="btn btn-primary w-100 py-2" type="submit">Ingresar</button>
    </form>
</main>
</body>
</html>
